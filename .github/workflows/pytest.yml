name: pytest

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', 3.11, 3.12, 3.13]
        sklearn: [1.0.2, 1.1.3, 1.2.2, 1.3.2, 1.4.2, 1.5.2, 1.6.1, 1.7.2, 1.8.0, 1.9.1]
        exclude:
          - python: '3.10'
            sklearn: 1.8.0
          - python: '3.10'
            sklearn: 1.9.1
          - python: 3.11
            sklearn: 1.0.2
          - python: 3.11
            sklearn: 1.1.3
          - python: 3.11
            sklearn: 1.2.2
          - python: 3.11
            sklearn: 1.3.2
          - python: 3.12
            sklearn: 1.0.2
          - python: 3.12
            sklearn: 1.1.3
          - python: 3.12
            sklearn: 1.2.2
          - python: 3.12
            sklearn: 1.3.2
          - python: 3.13
            sklearn: 1.0.2
          - python: 3.13
            sklearn: 1.1.3
          - python: 3.13
            sklearn: 1.2.2
          - python: 3.13
            sklearn: 1.3.2
          - python: 3.13
            sklearn: 1.4.2

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
    - run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then
          pip install --only-binary scikit-learn scikit-learn==${{ matrix.sklearn }} -r requirements.txt
        else
          pip install --only-binary scikit-learn scikit-learn==${{ matrix.sklearn }}
        fi
    - run: |
        python -m pytest
